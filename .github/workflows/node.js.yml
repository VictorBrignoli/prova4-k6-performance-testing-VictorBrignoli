name: K6 Performance Testing

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 12 * * *'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify code format
        run: npm run verify

  run-test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup K6
        uses: grafana/setup-k6-action@v1.2.2

      - name: Run local k6 test
        uses: grafana/run-k6-action@v1.4.0
        env:
          K6_WEB_DASHBOARD: true
          K6_WEB_DASHBOARD_EXPORT: src/output/dashboard.html
        with:
          path: src/tests

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: k6-reports
          path: src/output/
